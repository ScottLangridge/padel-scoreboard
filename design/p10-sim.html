<style>
  /* Layout: one centred panel on a dark bench, single dark look by design */
  :root {
    --bench: #121110;
    --pcb: #050505;
    --frame: #1d1c1a;
    --led-on: #ffc61a;
    --led-off: #2a2410;
    --label: #8a8270;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bench);
    color: var(--label);
    font-family: var(--font-mono);
    display: grid;
    place-items: center;
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .rig { width: 100%; max-width: 1100px; display: grid; gap: 10px; }
  .module {
    background: var(--frame);
    padding: clamp(6px, 1.2vw, 14px);
    border-radius: 4px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.04);
  }
  canvas { display: block; width: 100%; aspect-ratio: 2 / 1; max-width: 100%; background: var(--pcb); }
  .clips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .clips button {
    font: inherit; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--label); background: transparent; border: 1px solid rgba(255,255,255,.1);
    border-radius: 3px; padding: 6px 10px; cursor: pointer;
  }
  .clips button:hover { border-color: rgba(255,255,255,.3); color: #ddd; }
  .clips button[aria-pressed="true"] { color: var(--led-on); border-color: var(--led-on); }
  .clips button:focus-visible { outline: 2px solid var(--led-on); outline-offset: 2px; }
  .meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
</style>

<script>
/* =====================================================================
   ANIMATION — edit this section.
   animate(f, t) is called every frame.
     f = frame number, t = seconds since start
   Drawing helpers (x 0..31 left→right, y 0..15 top→bottom, v 0..1):
     clear()            all LEDs off
     set(x, y, v=1)     one LED
     get(x, y)
     line(x0,y0,x1,y1,v=1)
     rect(x,y,w,h,v=1,fill=false)
     text(str, x, y, v=1)   5x7 font, returns pixel width
     textWidth(str)
   ===================================================================== */
const FPS = 30;

/* Padel splash: court builds, serve, server takes the net, return,
   volley, lob forces the net player back, jumping smash from the back
   that bounces out over the glass, court slides away as PADEL drops in,
   ball bounces along, wipe, loop. */
const LOOP = 10.8;                 // seconds per cycle
const SLIDE = 5.9;                 // rally ends, title sequence starts
let oy = 0, jy = 0;                // scene offset (slide-out), jump height
const S = (x, y) => set(Math.round(x), Math.round(y) + oy - jy);
const lerp = (a, b, s) => a + (b - a) * s;
const ease = s => 1 - Math.pow(1 - s, 3);
const easeBack = s => { const c = 1.7; return 1 + (c + 1) * Math.pow(s - 1, 3) + c * Math.pow(s - 1, 2); };
function track(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) { const [t0, v0] = keys[i-1], [t1, v1] = keys[i]; return lerp(v0, v1, (t - t0) / (t1 - t0)); }
  }
  return keys[keys.length - 1][1];
}

// Player centre-column keyframes [time, x]
const L_X = [[0,3],[1.4,3],[2.3,10],[3.7,10],[4.45,4],[6.5,4]];        // serves, takes net, forced back
const R_X = [[0,27],[3.7,27],[4.6,24],[4.95,24],[5.5,28],[6.5,28]];    // returns, lobs, moves in, chases smash
// When each player strikes the ball
const CONTACTS = [
  { t: 1.3, side: 0, kind: "low"   },  // L underarm serve
  { t: 2.2, side: 1, kind: "drive" },  // R return
  { t: 2.8, side: 0, kind: "drive" },  // L volley at the net
  { t: 3.6, side: 1, kind: "low"   },  // R lobs over the net player
  { t: 4.8, side: 0, kind: "smash" },  // L jumping smash from the back
];
// Ball flight arcs [t0, t1, from, to, arc height]
const ARCS = [
  [0.9, 1.1,  [7,8],   [7,14],  0],    // ball dropped for the serve
  [1.1, 1.3,  [7,14],  [7,12],  1],
  [1.3, 1.85, [7,12],  [21,14], 7],    // serve
  [1.85,2.2,  [21,14], [23,7],  3],
  [2.2, 2.8,  [23,7],  [14,7],  2],    // return, volleyed
  [2.8, 3.2,  [14,7],  [19,14], 3],    // volley
  [3.2, 3.6,  [19,14], [23,12], 3],    // bounce up into the lob
  [3.6, 4.8,  [23,12], [6,1],   11],   // lob over the net player, off the top
  [4.8, 5.0,  [6,1],   [20,14], 0],    // smash
  [5.0, 5.5,  [20,14], [33,-3], 5],    // out over the back glass
];
const SMASH_ARC = 8, SMASH_BOUNCE = 5.0, SMASH_T = 4.8, BX = 20;

// Racket arm poses, relative to shoulder (px, 9), x mirrored by facing dir
const POSE = {
  ready:     [[1,0],[2,0],[3,-1],[4,-1],[3,-2],[4,-2]],
  back:      [[-1,0],[-2,0],[-3,-1],[-4,-1],[-3,-2],[-4,-2]],
  hit:       [[1,0],[2,-1],[3,-2],[4,-2],[5,-2],[4,-3],[5,-3]],
  lowBack:   [[-1,1],[-2,2],[-3,3],[-4,3],[-3,4],[-4,4]],
  low:       [[1,1],[2,2],[3,3],[4,3],[3,4],[4,4]],
  smashBack: [[-1,-1],[-1,-2],[-2,-3],[-2,-4],[-3,-4],[-2,-5],[-3,-5]],
  smashHit:  [[1,-1],[1,-2],[2,-3],[2,-4],[3,-4],[2,-5],[3,-5]],
};
function poseFor(side, t) {
  for (const c of CONTACTS) {
    if (c.side !== side) continue;
    const d = t - c.t;
    if (c.kind === "smash") {
      if (d >= -0.4 && d < 0) return "smashBack";
      if (d >= 0 && d < 0.08) return "smashHit";
      if (d >= 0.08 && d < 0.3) return "low";          // follow-through down
    } else {
      if (d >= -0.25 && d < 0) return c.kind === "low" ? "lowBack" : "back";
      if (d >= 0 && d < 0.2) return c.kind === "low" ? "low" : "hit";
    }
  }
  return "ready";
}
function player(px, d, pose, legs) {
  [[0,-1],[-1,0],[0,0],[1,0],[0,1]].forEach(([x,y]) => S(px + x, 6 + y));   // head
  for (let y = 8; y <= 11; y++) S(px, y);                                     // body
  if (legs === "air") { S(px-1,12); S(px+1,12); S(px-2,13); S(px+2,13); }    // tucked jump
  else { S(px-1,12); S(px-1,13); S(px-legs,14); S(px+1,12); S(px+1,13); S(px+legs,14); }
  if (pose.startsWith("smash")) { S(px + d, 8); S(px + 2*d, 7); }            // tracking arm points up
  else if (!pose.toLowerCase().includes("back")) { S(px - d, 9); S(px - 2*d, 10); }
  POSE[pose].forEach(([x,y]) => S(px + x*d, 9 + y));                          // racket arm
}
function legsFor(keys, t) {
  if (jy > 0) return "air";
  const v = Math.abs(track(keys, t + 0.04) - track(keys, t - 0.04));
  if (v > 0.05) return Math.floor(t / 0.09) % 2 ? 2 : 0;    // running stride
  return Math.floor(t / 0.25) % 2 ? 2 : 1;                 // split-step
}
function court(p) {          // p: 0..1 build progress
  const w = Math.min(1, p / 0.6) * 16;
  for (let x = 0; x < 32; x++) if (Math.abs(x - 15.5) < w) S(x, 15);
  const nh = Math.max(0, Math.min(4, Math.round((p - 0.4) / 0.4 * 4)));
  for (let i = 0; i < nh; i++) {
    const y = 14 - i;
    if (i === 3) { S(15, y); S(16, y); }          // net tape
    else S((y % 2) ? 15 : 16, y);                 // mesh
  }
  const wh = Math.max(0, Math.min(5, Math.round((p - 0.5) / 0.4 * 5)));
  for (let i = 0; i < wh; i++) { S(0, 14 - i); S(31, 14 - i); }  // back glass
}
function ballAt(i, u) {
  const [, , a, b, h] = ARCS[i];
  return [lerp(a[0], b[0], u), lerp(a[1], b[1], u) - h * 4 * u * (1 - u)];
}
function scene(t) {
  court(t);
  if (t >= 0.8) {
    const d = (t - SMASH_T) / 0.3;
    jy = Math.abs(d) < 1 ? Math.round(3 * (1 - d * d)) : 0;
    player(Math.round(track(L_X, t)), 1, poseFor(0, t), legsFor(L_X, t));
    jy = 0;
    player(Math.round(track(R_X, t)), -1, poseFor(1, t), legsFor(R_X, t));
  }
  for (let i = 0; i < ARCS.length; i++) {
    const [t0, t1] = ARCS[i];
    if (t < t0 || t >= t1) continue;
    const u = (t - t0) / (t1 - t0);
    const [x, y] = ballAt(i, u);
    S(x, y);
    if (i === SMASH_ARC) { const [px, py] = ballAt(i, Math.max(0, u - 0.25)); S(px, py); }  // speed trail
  }
  if (t >= SMASH_BOUNCE && t < SMASH_BOUNCE + 0.12) {   // impact burst
    S(BX,11); S(BX-2,13); S(BX+2,13); S(BX-3,14); S(BX+3,14);
  }
}

function swapClip() {

  const PRESS = 3.5, EMERGE = PRESS + 0.3;
  return t => {
    netLine();
    const IN = Math.pow(clampT(t, 0, 0.5), 2), OUTP = ez(t, EMERGE, EMERGE + 0.6);   // accelerate in, decelerate out
    const s = t < EMERGE ? a : b, k = t < EMERGE ? Math.round(IN * 12) : Math.round((1 - OUTP) * 12);
    if (t < 0.5 || t >= EMERGE) {
      for (let x = 14; x <= 17; x++) set(x, PY + 3);
      clip = [0, 13, 0, 15]; text(s.lp, lx(s.lp) + k, PY); text3(s.lg, GL + k, GY); clip = null;    // left half slides in / out
      clip = [18, 31, 0, 15]; text(s.rp, R_EDGE - k, PY); text3(s.rg, GR - k, GY); clip = null;     // right half
    }
    const h = t < EMERGE ? 1 - IN : OUTP;                                                          // set cells shrink then regrow
    for (let y = 9; y < 16; y++) { set(2, y); set(29, y); }
    const cell = (x0, i) => { const rows = Math.round(4 * h); for (let y = (i ? 12 : 16) - rows; y < (i ? 12 : 16); y++) { set(x0, y); set(x0 + 1, y); } };
    for (let i = 0; i < s.ls; i++) cell(0, i);
    for (let i = 0; i < s.rs; i++) cell(30, i);
    if (t >= 0.5 && t < EMERGE) {                      // the prompt
      const up = Math.round(ez(t, PRESS, EMERGE) * 8);  // rolls away once acknowledged
      clip = [0, 31, PY, PY + 6]; altWords("SWAP", "ENDS", t - 0.5, PY - up); clip = null;
      const ph = (t - 0.5) % 1.5;                       // arrowheads walk in from each edge and cross through each other
      if (t < PRESS && ph < 1.1) { const d = Math.round(ease(ph / 1.1) * 23); tri(5 + d, 1, 0); tri(26 - d, -1, 0); }
    }
    if (t < 0.5) serve(a.sv, a.bx); else if (t >= EMERGE) serve(b.sv, b.bx);
  };
}
// ---- Golden point: the point that makes 40-40 lands, the dash stands up into a vertical bar
//      which splits and sweeps both ways to the edges, wiping 40-40 away and leaving GOLDEN
//      (a tighter 4-wide face so it fits) behind it, with one glint. GOLDEN stays up. 2.3s
const F4 = {
  G: [".##.", "#..#", "#...", "#.##", "#..#", "#..#", ".##."],
  O: [".##.", "#..#", "#..#", "#..#", "#..#", "#..#", ".##."],
  L: ["#...", "#...", "#...", "#...", "#...", "#...", "####"],
  D: ["###.", "#..#", "#..#", "#..#", "#..#", "#..#", "###."],
  E: ["####", "#...", "#...", "###.", "#...", "#...", "####"],
  N: ["#..#", "##.#", "##.#", "#.##", "#.##", "#..#", "#..#"],
  S: [".###", "#...", "#...", ".##.", "...#", "...#", "###."],
  C: [".##.", "#..#", "#...", "#...", "#...", "#..#", ".##."],
  T: ["####", ".#..", ".#..", ".#..", ".#..", ".#..", ".#.."],
  R: ["###.", "#..#", "#..#", "###.", "#.#.", "#..#", "#..#"],
  V: ["#..#", "#..#", "#..#", "#..#", "#..#", ".##.", ".##."],
};
function text4(str, x, y) {
  for (const c of str) { const g = F4[c]; if (g) for (let j = 0; j < 7; j++) for (let i = 0; i < 4; i++) if (g[j][i] === "#") set(x + i, y + j); x += 5; }
}
function goldClip() {
  const a = ST(3, 2, 3, 2, 1, 0, 1, 0), b = ST(3, 3, 3, 2, 1, 0, 1, 1);
  const GX = 2;                                      // GOLDEN is 29 wide: cols 2-30
  return t => {
    netLine(); games(a.lg, a.rg); setsTally(a.ls, a.rs); serveFlip(a, b, clampT(t, 0.5, 0.75));
    const T1 = 0.75, T2 = 1.0, T3 = 1.45;           // dash becomes a bar; bars sweep out; done
    if (t < T2) {                                     // the point lands; the dash stands up into a vertical bar
      text(a.lp, lx(a.lp), PY); roll(a.rp, b.rp, () => R_EDGE, PY, clampT(t, 0.3, 0.7), 1);
      winBall(t, 0, 1);
      const p = ez(t, T1, T2), hw = Math.round(lerp(2, 1, p)), hh = Math.round(lerp(0, 3, p));
      for (let y = PY + 3 - hh; y <= PY + 3 + hh; y++) for (let x = 16 - hw; x <= 15 + hw; x++) set(x, y);
    } else if (t < T3) {                              // twin bars sweep to the edges, 40-40 ahead of them, GOLDEN behind
      const d = Math.round(ez(t, T2, T3) * 16);
      clip = [0, 13 - d, PY, PY + 6]; text(b.lp, lx(b.lp), PY); clip = [18 + d, 31, PY, PY + 6]; text(b.rp, R_EDGE, PY);
      clip = [15 - d, 16 + d, PY, PY + 6]; text4("GOLDEN", GX, PY); clip = null;
      for (let y = PY; y <= PY + 6; y++) { set(15 - d, y); set(16 + d, y); }
    } else {
      text4("GOLDEN", GX, PY);
      const g = ez(t, 1.6, 2.2) * 44 - 6;             // one glint: a dark diagonal streak crossing the letters
      if (t >= 1.6 && t < 2.2) for (let y = PY; y <= PY + 6; y++) { set(Math.round(g - y), y, 0); set(Math.round(g - y) + 1, y, 0); }
    }
  };
}

// ---- First serve: SELECT / SERVE alternates on top while an arrowhead beckons at each
//      edge; the side that serves presses. The prompt rolls away, their arrowhead glides to
//      the bottom centre and becomes the serve triangle, and the rest of the fresh board
//      emerges from the centre around it. Simulated left press at 3.0s. 4.4s
function marquee(str, t, y, speed = 25, gap = 16) { // continuous right-to-left scroll
  const w = textWidth(str) + gap - 1, period = w / speed;
  const x = 32 - (t % period) * speed;
  text(str, Math.round(x), y); text(str, Math.round(x + w), y); if (x + 2 * w < 32) text(str, Math.round(x + 2 * w), y);
}
function servePrompt(t, arrows = true) {            // the waiting state, shared with the end of Bind
  netLine(); altWords("SELECT", "SERVE", t, 0, 0.9, 0.2, "4");  // condensed face so SELECT fits; calmer pace than Bind
  if (arrows) { const n = Math.floor(t / 0.5) % 2; tri(4, -1, n); tri(27, 1, n); }
}
function firstServeClip() {
  const PRESS = 3.0, GLIDE = PRESS + 0.5, MORPH = GLIDE + 0.3, DONE = MORPH + 0.6;
  const BX = 1;                                     // the left team's right-hand box is the bottom of the panel
  return t => {
    if (t < PRESS) { servePrompt(t); return; }
    netLine();
    const up = Math.round(ez(t, PRESS, PRESS + 0.3) * 8);            // the prompt rolls up and out
    if (up < 8) { clip = [0, 31, PY, PY + 6]; altWords("SELECT", "SERVE", t, PY - up, 0.9, 0.2, "4"); clip = null; }
    if (t < GLIDE) tri(Math.round(lerp(4, 13, ez(t, PRESS, GLIDE))), -1, 0);
    else if (t < MORPH) { const p = clampT(t, GLIDE, MORPH); if (p < 0.5) { const k = Math.round(2 * (1 - 2 * p)); for (let i = 0; i <= k; i++) for (let y = 12 - i; y <= 12 + i; y++) set(13 + i, y); } else serve(0, BX, Math.max(1, Math.round(4 * (2 * p - 1)))); }
    else {                                                            // the rest of the board emerges from the centre around the triangle
      serve(0, BX);
      const o = ez(t, MORPH, DONE), k = Math.round((1 - o) * 12);
      for (let x = 14; x <= 17; x++) set(x, PY + 3);
      clip = [0, 13, 0, 15]; text("0", lx("0") + k, PY); text3("0", GL + k, GY); clip = null;
      clip = [18, 31, 0, 15]; text("0", R_EDGE - k, PY); text3("0", GR - k, GY); clip = null;
      const rows = Math.round(o * 7); for (let y = 9; y < 9 + rows; y++) { set(2, y); set(29, y); }   // set posts grow down from the line
    }
  };
}

const CLIPS = [
  { name: "Splash",  dur: 2.5 + RALLY_MS / 1000 + 0.95 + 2.2, loopFrom: 0, fn: splash },
  { name: "Bind",    dur: 8.4,  hold: 1.5,     fn: bindClip() },
  { name: "Serve?",  dur: 4.4,  hold: 1.5,     fn: firstServeClip() },
  { name: "Point L", dur: 0.75, hold: 1.2,     fn: pointClip(0) },
  { name: "Point R", dur: 0.75, hold: 1.2,     fn: pointClip(1) },
  { name: "Undo",    dur: 0.75, hold: 1.2,     fn: undoClip() },
  { name: "Game",    dur: 2.4,  hold: 1.5,     fn: gameClip() },
  { name: "Set",     dur: 3.4,  hold: 1.5,     fn: setClip() },
  { name: "Match",   dur: 6.5,  hold: 1.5,     fn: matchClip() },
  { name: "Swap",    dur: 4.4,  hold: 1.5,     fn: swapClip() },
  { name: "Golden",  dur: 2.3,  hold: 2.5,     fn: goldClip() },
];
let clipIdx = 1;
function animate(f, t) {
  clear();
  const c = CLIPS[clipIdx];
  let lt = t;
  if (c.loopFrom != null) { if (lt > c.dur) lt = c.loopFrom + (lt - c.dur) % (c.dur - c.loopFrom); }
  else { lt = lt % (c.dur + c.hold); if (lt > c.dur) lt = c.dur; }
  T = t;
  c.fn(lt);
  return lt;
}

/* =====================================================================
   SIMULATOR — no need to edit below.
   ===================================================================== */
const W = 32, H = 16;
const buf = new Float32Array(W * H);
const clamp = v => Math.max(0, Math.min(1, v));
function clear() { buf.fill(0); }
let clip = null;   // [x0, x1, y0, y1] inclusive, or null
function set(x, y, v = 1) {
  x = Math.round(x); y = Math.round(y);
  if (x < 0 || x >= W || y < 0 || y >= H) return;
  if (clip && (x < clip[0] || x > clip[1] || y < clip[2] || y > clip[3])) return;
  buf[y * W + x] = clamp(v);
}
function get(x, y) { return (x >= 0 && x < W && y >= 0 && y < H) ? buf[(y|0) * W + (x|0)] : 0; }
function line(x0, y0, x1, y1, v = 1) {
  x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;) { set(x0, y0, v); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
function rect(x, y, w, h, v = 1, fill = false) {
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++)
    if (fill || i === 0 || j === 0 || i === w - 1 || j === h - 1) set(x + i, y + j, v);
}

// 5x7 font, each glyph = 5 column bytes, bit 0 = top row
const FONT = {
  " ":[0,0,0,0,0], "!":[0,0,95,0,0], "-":[8,8,8,8,8], ".":[0,96,96,0,0], ":":[0,54,54,0,0], "/":[32,16,8,4,2],
  "0":[62,81,73,69,62],"1":[0,66,127,64,0],"2":[66,97,81,73,70],"3":[33,65,69,75,49],"4":[24,20,18,127,16],
  "5":[39,69,69,69,57],"6":[60,74,73,73,48],"7":[1,113,9,5,3],"8":[54,73,73,73,54],"9":[6,73,73,41,30],
  "A":[126,17,17,17,126],"B":[127,73,73,73,54],"C":[62,65,65,65,34],"D":[127,65,65,34,28],"E":[127,73,73,73,65],
  "F":[127,9,9,9,1],"G":[62,65,73,73,122],"H":[127,8,8,8,127],"I":[0,65,127,65,0],"J":[32,64,65,63,1],
  "K":[127,8,20,34,65],"L":[127,64,64,64,64],"M":[127,2,12,2,127],"N":[127,4,8,16,127],"O":[62,65,65,65,62],
  "P":[127,9,9,9,6],"Q":[62,65,81,33,94],"R":[127,9,25,41,70],"S":[70,73,73,73,49],"T":[1,1,127,1,1],
  "U":[63,64,64,64,63],"V":[31,32,64,32,31],"W":[63,64,56,64,63],"X":[99,20,8,20,99],"Y":[7,8,112,8,7],"Z":[97,81,73,69,67],
  "x":[68,40,16,40,68]
};
function glyph(c) { return FONT[c] || FONT[c.toUpperCase()] || FONT[" "]; }
function textWidth(s) { return s.length * 6; }
function text(s, x, y, v = 1) {
  let cx = x | 0;
  for (const c of s) {
    const g = glyph(c);
    for (let i = 0; i < 5; i++) for (let j = 0; j < 7; j++) if (g[i] >> j & 1) set(cx + i, y + j, v);
    cx += 6;
  }
  return cx - x;
}
const F3 = { "0":["111","101","101","101","111"],"1":["010","110","010","010","111"],"2":["111","001","111","100","111"],
  "3":["111","001","111","001","111"],"4":["101","101","111","001","001"],"5":["111","100","111","001","111"],
  "6":["111","100","111","101","111"],"7":["111","001","001","010","010"],"8":["111","101","111","101","111"],
  "9":["111","101","111","001","111"],"-":["000","000","111","000","000"]," ":["000","000","000","000","000"] };
function text3(s, x, y, v = 1) {
  let cx = x | 0;
  for (const c of s) { const g = F3[c] || F3[" "]; for (let j = 0; j < 5; j++) for (let i = 0; i < 3; i++) if (g[j][i] === "1") set(cx + i, y + j, v); cx += 4; }
  return cx - x - 1;
}

// Rendering
const cv = document.getElementById("panel"), ctx = cv.getContext("2d");
const css = getComputedStyle(document.documentElement);
const ON = css.getPropertyValue("--led-on").trim(), OFF = css.getPropertyValue("--led-off").trim();
const PITCH = cv.width / W, R = PITCH * 0.36;
const stat = document.getElementById("stat");

function draw() {
  ctx.fillStyle = "#050505";
  ctx.fillRect(0, 0, cv.width, cv.height);
  // off LEDs
  ctx.fillStyle = OFF;
  ctx.beginPath();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const cx = (x + .5) * PITCH, cy = (y + .5) * PITCH;
    ctx.moveTo(cx + R, cy); ctx.arc(cx, cy, R, 0, Math.PI * 2);
  }
  ctx.fill();
  // lit LEDs with glow
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const v = buf[y * W + x]; if (!v) continue;
    const cx = (x + .5) * PITCH, cy = (y + .5) * PITCH;
    ctx.globalAlpha = v * 0.35;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, PITCH * 0.9);
    g.addColorStop(0, ON); g.addColorStop(1, "rgba(255,198,26,0)");
    ctx.fillStyle = g; ctx.fillRect(cx - PITCH, cy - PITCH, PITCH * 2, PITCH * 2);
    ctx.globalAlpha = v;
    ctx.fillStyle = ON; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,250,220,.55)"; ctx.beginPath(); ctx.arc(cx - R * .25, cy - R * .25, R * .4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

let frame = 0, start = performance.now(), last = 0;
const bar = document.getElementById("clips");
CLIPS.forEach((c, i) => {
  const b = document.createElement("button"); b.type = "button"; b.id = "clip-" + i; b.textContent = c.name;
  b.onclick = () => { clipIdx = i; start = performance.now(); frame = 0; [...bar.children].forEach((e, j) => e.setAttribute("aria-pressed", j === i)); };
  b.setAttribute("aria-pressed", i === clipIdx); bar.appendChild(b);
});
function loop(now) {
  requestAnimationFrame(loop);
  if (now - last < 1000 / FPS - 1) return;
  last = now;
  let lt = 0;
  try { lt = animate(frame, (now - start) / 1000); } catch (e) { console.error(e); }
  draw();
  stat.textContent = `${CLIPS[clipIdx].name} · ${lt.toFixed(2)}s`;
  frame++;
}
requestAnimationFrame(loop);
</script>
